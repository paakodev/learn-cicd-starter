on:
    push:
        branches: [main]

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.27.1"

            - name: Build
              run: ./scripts/buildprod.sh

            - id: 'auth'
              uses: 'google-github-actions/auth@v2'
              with:
                  credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

            - name: 'Set up Cloud SDK'
              uses: 'google-github-actions/setup-gcloud@v3'

            - name: 'Push to GCP Artifact Registry'
              run: >
                gcloud builds submit
                --tag us-central1-docker.pkg.dev/$(gcloud config get-value project)/notely-ar-repo/notely:latest .

            - name: 'Deploy to Cloud Run'
              run: >
                gcloud run deploy notely
                --image us-central1-docker.pkg.dev/$(gcloud config get-value project)/notely-ar-repo/notely:latest
                --region us-central1
                --platform managed
                --allow-unauthenticated
                --project $(gcloud config get-value project)
                --max-instances=4
